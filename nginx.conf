server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Assets are requested as file.js?v=<hash of this build's assets> (see Dockerfile).
    # During a deploy the old and new containers briefly overlap; if this container gets asked for
    # a *different* version it must not answer with its own (stale) file, or a CDN/browser would
    # cache old code under the new URL. So: wrong version -> 404 that nothing is allowed to store.
    location ~* \.(?:js|css)$ {
        if ($arg_v !~ "^(__ASSET_VERSION__)?$") {
            add_header Cache-Control "no-store" always;
            return 404;
        }
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ /index.html;
    }
}
